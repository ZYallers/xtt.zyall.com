<!DOCTYPE html>
<html lang="zh-CN" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>时光小屋 · 成长相册</title>
<meta name="description" content="把散落在年月里孩子长大的瞬间收起来，沿着时光看看那个小小滴娃。">
<!-- 微信「转发给朋友」的卡片：标题取 <title>，描述取下面的 description，
     缩略图取 og:image / image_src（需绝对地址、≥300×300）。缺了这些微信只给一条纯链接 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="时光小屋">
<meta property="og:title" content="时光小屋 · 成长相册">
<meta property="og:description" content="把散落在年月里孩子长大的瞬间收起来，沿着时光看看那个小小滴娃。">
<meta property="og:image" content="https://xtt.zyall.com/assets/img/share-card.jpg">
<meta property="og:image:width" content="640">
<meta property="og:image:height" content="640">
<!-- 刻意不写 og:url：它会声明"规范地址"，抓取器可能据此合并缓存，
     导致带 ?v= 的新地址仍然命中旧卡片。卡片信息按当前 URL 抓即可 -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="时光小屋 · 成长相册">
<meta name="twitter:description" content="只给家里人看的成长相册，凭密码进入。">
<meta name="twitter:image" content="https://xtt.zyall.com/assets/img/share-card.jpg">
<link rel="image_src" href="https://xtt.zyall.com/assets/img/share-card.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbf3e6">
<link rel="stylesheet" href="assets/css/main.css">
<!-- 入场守卫：无有效会话时会在渲染前跳转到 login.html -->
<script src="assets/js/auth.js"></script>
</head>
<body>

<!-- 微信转发卡片的缩略图兜底：部分版本取页面中第一张 ≥300px 的图片，
     这张图只为抓取而存在，视觉上完全移出屏幕（lazy 所以用户端也不会下载） -->
<img class="share-thumb" src="assets/img/share-card.jpg" width="640" height="640"
     alt="" aria-hidden="true" loading="lazy">

<noscript>
  <p style="padding:40px;font-family:system-ui;color:#7d6553">这个相册需要开启 JavaScript 才能解锁浏览</p>
</noscript>

<!-- 清单解密前的加载层：清单有几百 KB～1MB，弱网下给个明确的等待状态，别让人以为卡死 -->
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-card">
    <span class="boot-spin" aria-hidden="true"></span>
    <p class="boot-txt">正在打开相册…</p>
    <p class="boot-sub">首次会下载相册清单，之后浏览器会缓存它</p>
  </div>
</div>

<!-- 顶部用户条 -->
<div class="userbar" id="userbar" hidden>
  <span class="ub-dot" aria-hidden="true"></span>
  <span class="ub-name">—</span>
  <button class="ub-out" id="logoutBtn" type="button">退 出</button>
</div>

<!-- 顶部光晕与微尘 -->
<div class="ambient" aria-hidden="true">
  <div class="sun-glow"></div>
  <div class="dust" id="dust"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<header class="hero" id="top">
  <div class="hero-inner">
    <p class="hero-kicker">GROWING UP · 2017 — 2026</p>
    <h1 class="hero-title">时光小屋<span class="hero-dot">·</span>成长相册</h1>
    <p class="hero-sub">把散落在年月里的瞬间收起来<br>沿着时间线往前翻，随手挑一个分组，看看那个小小的他</p>

    <div class="hero-stats" id="heroStats">
      <div class="stat"><b id="statAll">0</b><span>影像</span></div>
      <div class="stat"><b id="statImg">0</b><span>照片</span></div>
      <div class="stat"><b id="statVid">0</b><span>视频</span></div>
      <div class="stat"><b id="statAlbum">0</b><span>分组</span></div>
    </div>

    <div class="hero-collage" id="heroCollage" aria-hidden="true"></div>
    <a class="hero-scroll" href="#browser" aria-label="开始浏览">
      <span></span>
    </a>
  </div>
</header>

<main id="browser">
  <!-- 筛选区 -->
  <section class="filters" id="filters">
    <div class="filter-inner">
      <!-- 常驻：左侧当前条件摘要，右侧折叠开关 -->
      <div class="filter-head">
        <span class="filter-summary" id="filterSummary"></span>
        <button class="filter-toggle" id="filterToggle" type="button"
                aria-expanded="true" aria-controls="filterBody">
          <span class="ft-txt">收起筛选</span>
          <svg class="ft-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor"
                  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="filter-body" id="filterBody">
        <div class="fb-inner">
          <div class="filter-row">
            <span class="filter-label">年份</span>
            <div class="chips" id="yearChips"></div>
          </div>
          <div class="filter-row">
            <span class="filter-label">分组</span>
            <div class="chips" id="albumChips"></div>
          </div>
          <div class="filter-row filter-tools">
            <div class="segmented" id="typeSeg" role="group" aria-label="类型筛选">
              <button data-type="all" class="on">全部</button>
              <button data-type="i">照片</button>
              <button data-type="v">视频</button>
            </div>
            <label class="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="search" type="search" placeholder="搜日期 / 分组 / 文件名…" autocomplete="off">
            </label>
            <button class="sort-btn desc" id="sortBtn" title="切换排序">
              <span class="sort-ico">↑</span><span id="sortTxt">从晚到早</span>
            </button>
            <span class="result-count" id="resultCount"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 网格 -->
  <section class="stage" aria-live="polite">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="empty-mark">◔</div>
      <p>这里还空着，换个年份或分组看看吧。</p>
    </div>
    <nav class="pager" id="pager" aria-label="分页"></nav>
  </section>
</main>

<footer class="footer">
  <p>时光小屋 · 成长相册 · 数据生成于 <span id="genTime">—</span></p>
  <p class="footer-tip">
    &COPY;2026 <a href="https://www.zyall.com/" target="_blank">ZYall</a> All Rights Reserved
    <a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备15018117号-1</a>
  </p>
</footer>

<button class="to-top" id="toTop" aria-label="回到顶部">↑</button>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" hidden>
  <div class="lb-backdrop" data-close></div>
  <div class="lb-stage">
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="上一张">‹</button>
    <figure class="lb-figure" id="lbFigure"></figure>
    <button class="lb-btn lb-next" id="lbNext" aria-label="下一张">›</button>
    <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
    <figcaption class="lb-cap" id="lbCap"></figcaption>
  </div>
</div>

<!-- 相册清单：按设备能力选格式。支持 DecompressionStream 的设备拿 v2（gzip+加密，体积约为 1/6），
     老设备拿 v1 原始加密版；async=false 保证并行下载但按序执行（清单先于 app.js） -->
<script>
(function () {
  var gz = typeof DecompressionStream !== 'undefined';
  ['gallery/' + (gz ? 'data.enc.js' : 'data-legacy.enc.js'), 'assets/js/app.js'].forEach(function (src) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    document.head.appendChild(s);
  });
})();
</script>
</body>
</html>
